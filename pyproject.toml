[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otter"
version = "0.1.0"
description = "Cross-species brain region mapping via Fused Gromov–Wasserstein"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["neuroscience", "optimal-transport", "cross-species", "brain-mapping",
            "gromov-wasserstein", "functional-connectivity"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas",
    "h5py",
    "mat73",
    "anndata>=0.10",
    "scikit-learn",
    "scikit-image",
    "nibabel",
    "nilearn",
    "matplotlib",
    "seaborn",
    "plotly",
    "pot>=0.9.4",
    "pyyaml",
    "openpyxl",
]

[project.optional-dependencies]
flow = ["torch"]
dev  = ["pytest", "ruff", "jupyterlab", "ipywidgets"]
docs = ["mkdocs", "mkdocs-material"]

[project.urls]
Homepage      = "https://github.com/peach-lucien/otter"
Repository    = "https://github.com/peach-lucien/otter"
Documentation = "https://github.com/peach-lucien/otter/blob/main/docs/README.md"
Explorer      = "https://peach-lucien.github.io/otter/"
Issues        = "https://github.com/peach-lucien/otter/issues"

[project.scripts]
# CLI shortcuts for the most-run pipeline steps. After `pip install -e .`
# you can call them directly without `python pipeline/...`.
otter-solve     = "otter.cli:solve_production"
otter-evaluate  = "otter.cli:evaluate"
otter-artefacts = "otter.cli:build_artefacts"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-ra -q"
# Registered so that `pytest -m "not slow"` actually deselects. Unregistered, the mark is a
# silent no-op: the filter matches nothing and the slow test runs anyway.
markers = [
    "slow: long-running test; deselect with -m 'not slow'",
]
filterwarnings = [
    # Old-API shim modules emit DeprecationWarnings — they're expected and
    # documented; surfacing them in test output is noise.
    "ignore::DeprecationWarning:otter\\..*",
]
