name: retune
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.26
  - scipy>=1.12
  - h5py
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - nibabel
  - jupyterlab
  - pip
  - pip:
    - mat73
    - anndata>=0.10
    - scanpy
    - pot>=0.9.4          # POT — Python Optimal Transport, our FGW backend
    - plotly
    - torch               # for OT-CFM in Phase 8 (CPU build is fine)
    - ruff
    - pytest
